name: KOMPAS100 Swing Scanner

on:
  schedule:
    # 11:00 UTC = 18:00 WIB, Senin-Jumat. GitHub bisa menunda cron beberapa menit saat antrean padat.
    - cron: "0 11 * * 1-5"
  workflow_dispatch:      # tombol "Run workflow" untuk uji manual

permissions:
  contents: write         # agar signals_log.csv bisa di-commit

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python swing_scanner_idx.py

      - name: Commit forward-test log
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add signals_log.csv || true
          git diff --staged --quiet || (git commit -m "chore: update signals log $(date -u +%F)" && git pull --rebase && git push)
